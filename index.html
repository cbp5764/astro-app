<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Astro AR Session</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="app.js?v=3" defer></script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <div id="permission-overlay" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 9999; display: flex; justify-content: center; align-items: center; color: white; font-family: sans-serif;">
      <button id="start-btn" style="padding: 15px 30px; font-size: 18px; background: #007aff; color: white; border: none; border-radius: 8px; cursor: pointer;">Iniciar Sesión AR</button>
    </div>

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" vr-mode-ui="enabled: false">
      <a-camera gps-camera rotation-reader></a-camera>
      <a-entity id="celestial-container"></a-entity>
    </a-scene>
  </body>
</html>
